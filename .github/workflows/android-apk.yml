name: Build Android prototype APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/**"
      - "mobile/backend/**"
      - ".github/workflows/android-apk.yml"

concurrency:
  group: ayloo-keyboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test mobile relay
        working-directory: mobile/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests -q

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"
          cache-provider: basic

      # A hosted runner normally creates a fresh debug certificate on every run. Keeping the
      # internal-test keystore stable prevents later beta APKs from failing with "App not installed".
      - name: Restore internal beta signing key
        id: signing-key-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ayloo-keyboard-internal-debug-key-v1

      - name: Require the established internal beta signing key
        if: steps.signing-key-cache.outputs.cache-hit != 'true'
        run: |
          echo "The established beta signing key was not restored; refusing to create an incompatible APK."
          exit 1

      - name: Configure internal test build
        working-directory: mobile/android
        run: |
          test -n "${{ secrets.AYLOO_API_BASE_URL }}" || (echo "AYLOO_API_BASE_URL is missing" && exit 1)
          test -n "${{ secrets.AYLOO_TESTER_TOKEN }}" || (echo "AYLOO_TESTER_TOKEN is missing" && exit 1)
          cat > local.properties <<'EOF'
          AYLOO_API_BASE_URL=${{ secrets.AYLOO_API_BASE_URL }}
          AYLOO_TESTER_TOKEN=${{ secrets.AYLOO_TESTER_TOKEN }}
          AYLOO_APPLICATION_ID=com.ayloo.keyboard.internal
          EOF

      - name: Test and assemble debug APK
        working-directory: mobile/android
        env:
          AYLOO_SIGNING_STORE_FILE: ${{ github.workspace }}/.ci-signing/debug.keystore
        run: |
          mkdir -p "$(dirname "$AYLOO_SIGNING_STORE_FILE")"
          cp "$HOME/.android/debug.keystore" "$AYLOO_SIGNING_STORE_FILE"
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Name install file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Ayloo-Keyboard-0.6.0-beta.apk

      - name: Verify package, certificate, and checksum
        run: |
          badging=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Ayloo-Keyboard-0.6.0-beta.apk | head -n 1)
          echo "$badging" | grep -F "package: name='com.ayloo.keyboard.internal' versionCode='13' versionName='0.6.0-beta'"
          keytool -exportcert -keystore "$HOME/.android/debug.keystore" -storepass android \
            -alias androiddebugkey -file restored-signing-certificate.der
          expected_certificate=$(sha256sum restored-signing-certificate.der | cut -d ' ' -f 1)
          cert_report=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Ayloo-Keyboard-0.6.0-beta.apk)
          echo "$cert_report"
          actual_certificate=$(echo "$cert_report" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$actual_certificate" = "$expected_certificate"
          echo "$actual_certificate" > Ayloo-Keyboard-0.6.0-beta.certificate.sha256
          sha256sum Ayloo-Keyboard-0.6.0-beta.apk > Ayloo-Keyboard-0.6.0-beta.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayloo-keyboard-0.6.0-beta-apk
          path: |
            Ayloo-Keyboard-0.6.0-beta.apk
            Ayloo-Keyboard-0.6.0-beta.apk.sha256
            Ayloo-Keyboard-0.6.0-beta.certificate.sha256
          if-no-files-found: error
          retention-days: 90
