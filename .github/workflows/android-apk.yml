name: Build Android prototype APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/android/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Test mobile relay
        working-directory: mobile/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests -q

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"
          cache-provider: basic

      # A hosted runner normally creates a fresh debug certificate on every run. Keeping the
      # internal-test keystore stable prevents later beta APKs from failing with "App not installed".
      - name: Restore internal beta signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ayloo-keyboard-internal-debug-key-v1

      - name: Create internal beta signing key when absent
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Ayloo Internal Beta,O=Ayloo,C=IN"
          fi

      - name: Configure internal test build
        working-directory: mobile/android
        run: |
          test -n "${{ secrets.AYLOO_API_BASE_URL }}" || (echo "AYLOO_API_BASE_URL is missing" && exit 1)
          test -n "${{ secrets.AYLOO_TESTER_TOKEN }}" || (echo "AYLOO_TESTER_TOKEN is missing" && exit 1)
          cat > local.properties <<'EOF'
          AYLOO_API_BASE_URL=${{ secrets.AYLOO_API_BASE_URL }}
          AYLOO_TESTER_TOKEN=${{ secrets.AYLOO_TESTER_TOKEN }}
          EOF

      - name: Test and assemble debug APK
        working-directory: mobile/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Name install file
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Ayloo-Keyboard-0.5.0-beta.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ayloo-keyboard-0.5.0-beta-apk
          path: Ayloo-Keyboard-0.5.0-beta.apk
          if-no-files-found: error
          retention-days: 14
